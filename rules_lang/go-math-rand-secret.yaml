# CodeGuard's own rule (not vendored; see NOTICE). The vendored gosec-derived
# go_crypto_rule-weakrandsource matches only an aliased import
# (`mrand "math/rand"`), so the common plain `import "math/rand"` raised
# nothing. This one covers the plain import (and, since Semgrep resolves Go
# import aliases, an aliased one too, including Read and Intn, which the
# vendored rule does not list), and only where the value is plainly
# security-sensitive (a token, key, secret, password, nonce, salt, session,
# uuid, or an invite/reset/verification id), so jitter, shuffling and
# picking stay quiet. Overlap: an aliased import with one of the methods the
# vendored rule lists raises both rules on the same line.
rules:
  - id: codeguard-go-math-rand-secret
    languages: [go]
    severity: WARNING
    metadata:
      cwe: "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator"
      owasp: "A02:2021 Cryptographic Failures"
    message: >
      A security-sensitive value is drawn from math/rand, which is
      predictable: its output can be reconstructed from a few observed
      values. Use crypto/rand for tokens, keys, passwords and ids.
    patterns:
      - pattern-inside: |
          import "math/rand"
          ...
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  func $FN(...) { ... }
              - metavariable-regex:
                  metavariable: $FN
                  regex: (?i).*(token|secret|passw|pwd|apikey|api_key|nonce|salt|session|otp|csrf).*
              - pattern: rand.$M(...)
          - patterns:
              - pattern-either:
                  - pattern: $VAR := <... rand.$M(...) ...>
                  - pattern: $VAR = <... rand.$M(...) ...>
                  - pattern: var $VAR = <... rand.$M(...) ...>
                  - pattern: $OBJ.$VAR = <... rand.$M(...) ...>
              - metavariable-regex:
                  metavariable: $VAR
                  regex: (?i).*(token|secret|passw|pwd|key|nonce|salt|session|otp|csrf|uuid|guid|(invite|reset|verif|activation|recovery|magic).*(id|code|link)).*
