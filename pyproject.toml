[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeguard"
version = "2.0.0.dev0"
description = "AI-aware code review GitHub App"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.0,<2",
    "langchain-core>=1.4.0,<2",
    "langchain-anthropic>=1.4.3,<2",
    "langgraph>=1.2.0,<2",
    "anthropic>=0.99.0,<1.0",
    "langsmith>=0.3.45,<0.4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary,pool]>=3,<4",
    "prometheus-client>=0.20,<1",
    "python-dotenv>=0.21.0",
    "tiktoken>=0.13.0",
    "requests>=2.34.2",
    "PyJWT>=2.8,<3",
    "PyYAML>=6,<7",
    "cryptography>=42,<44",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Dashboard templating. Chosen for autoescape-by-default: every
    # string the dashboard renders originates in a PR (file paths, rule
    # ids, tool messages that echo matched source), so escaping has to
    # be the default rather than something each template remembers.
    "jinja2>=3.1,<4",
    # Exact pins, not the floor+cap convention used above: these are
    # analysis tools whose *output* (which rules fire, message wording)
    # can shift between versions in ways that make review results
    # non-reproducible — unlike an SDK/framework version bump, a rules
    # engine version bump is a behavior change we want to opt into
    # deliberately, not absorb silently on the next `pip install`.
    "semgrep==1.45.0",
    "bandit==1.7.9",
    "ruff==0.6.9",
    # Phase 11: codeguard/mcp/server.py. Pinned to the v2 API
    # (MCPServer in mcp.server.mcpserver) — v1's FastMCP is a different
    # import path entirely, not just a version bump.
    "mcp>=2.0.0,<3",
]

[project.scripts]
codeguard = "codeguard.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
# Phase 10 removed v1's tests/e2e_test.py and tests/test_guardrails.py
# (old script-style "tests" predating real pytest usage, which this
# testpaths list originally existed to avoid collecting) along with the
# rest of v1 — every real test now lives under one of these, so this
# could become the default (bare `pytest`) again, but there's no
# benefit to widening it back until something actually needs to live
# outside these directories.
testpaths = ["tests/queue", "tests/diff", "tests/tools", "tests/github", "tests/pipeline", "tests/cli", "tests/mcp", "tests/api"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["codeguard"]
