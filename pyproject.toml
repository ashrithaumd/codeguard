[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeguard"
version = "2.0.0.dev0"
description = "AI-aware code review GitHub App"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.0,<2",
    "langchain-core>=1.4.0,<2",
    "langchain-anthropic>=1.4.3,<2",
    "langgraph>=1.2.0,<2",
    "anthropic>=0.99.0,<1.0",
    "langsmith>=0.3.45,<0.4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary]>=3,<4",
    "prometheus-client>=0.20,<1",
    "python-dotenv>=0.21.0",
    "tiktoken>=0.13.0",
    "requests>=2.34.2",
    "PyJWT>=2.8,<3",
    "cryptography>=42,<44",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["codeguard"]
