services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "codeguard.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "codeguard.worker.main"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Overrides the image's baked-in HEALTHCHECK (which checks :8501,
      # Streamlit — meaningless here). :9000 is this replica's own
      # metrics server (start_http_server in worker/main.py) — Docker
      # evaluates HEALTHCHECK inside each container's own network
      # namespace, so this correctly checks each --scale'd replica
      # independently, not some shared host port.
      test: ["CMD", "curl", "-f", "http://localhost:9000/metrics"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
