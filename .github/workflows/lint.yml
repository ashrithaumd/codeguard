# Ruff, on every push and pull request.
#
# There was no lint step in CI at all: build-push.yml builds, pushes and
# smoke-tests the image, and 19 real lint errors had accumulated in tests/
# with nothing to say so. Pinned to the same ruff as pyproject.toml's dev
# extra, so CI and a local `ruff check .` cannot disagree about a rule.
# The intentionally bad code (the Semgrep rule test file, the eval
# fixtures) is excluded by [tool.ruff] in pyproject.toml, not here, so the
# exclusion is the same wherever ruff runs.
#
# No secrets, no Azure login: lint needs read access to the code and
# nothing else.

name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install ruff
        run: pip install ruff==0.6.9
      - name: ruff check
        run: ruff check .
