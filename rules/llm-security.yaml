# CodeGuard's custom LLM-security ruleset, mapped to the OWASP Top 10 for
# LLM Applications (2025). Every rule carries `metadata.owasp`, and every
# rule that depends on a third-party library symbol carries
# `metadata.verified` recording what was actually checked, against which
# version, on what date — because a renamed kwarg makes a rule match
# nothing, and a rule that matches nothing looks exactly like a clean
# scan.
#
# VALIDATION, 2026-09-23
#
# Symbols: introspected against langchain 1.4.2, langchain-community
# 0.4.2, langchain-experimental 0.4.2, langchain-openai 1.6.4,
# langchain-anthropic 1.7.2, llama-index-core 0.14.25, transformers, and
# fastapi/flask/markupsafe, installed into a throwaway container. Not
# project dependencies. Results are in each rule's `verified` field,
# including the ones that could NOT be confirmed.
#
# External corpus: simonw/llm @ 0.36 (54 Python files, ~37k lines), an
# OpenAI-first codebase nobody here wrote. First scan produced 24
# findings and ALL 24 WERE WRONG — every one traceable to a single blind
# spot, a `**kwargs` splat mixed with named arguments, where the caps and
# the system prompt arrive inside the dict semgrep cannot see into. That
# is now excluded, with regression cases, and the same scan produces 0.
# codeguard/, tests/ and scripts/ also scan clean.
#
# Worth keeping in mind when adding a rule: `semgrep --test` passing
# proves a pattern matches the examples someone already thought of. It
# says nothing about the shapes real code uses, and every false positive
# found so far was found by scanning real code, never by the test file.
rules:
  - id: llm-prompt-injection-concatenation
    languages: [python]
    severity: ERROR
    metadata:
      owasp: "LLM01:2025 Prompt Injection"
    message: >
      Untrusted input concatenated directly into an LLM prompt's content
      with no delimiting — string concatenation or an f-string embedding
      a variable. An attacker who controls that variable can inject
      instructions the model will treat as part of the prompt, not as
      data. Delimit untrusted content explicitly (e.g. XML-ish tags) or
      pass it as a separate, clearly-labeled section instead of
      splicing it into the instruction text itself.
    patterns:
      - pattern-either:
          # Anthropic Messages API
          - pattern: '$CLIENT.messages.create(..., messages=[..., {"role": "user", "content": $A + $B}, ...], ...)'
          - pattern: '$CLIENT.messages.create(..., messages=[..., {"role": "user", "content": f"..."}, ...], ...)'
          # OpenAI Chat Completions API
          - pattern: '$CLIENT.chat.completions.create(..., messages=[..., {"role": "user", "content": $A + $B}, ...], ...)'
          - pattern: '$CLIENT.chat.completions.create(..., messages=[..., {"role": "user", "content": f"..."}, ...], ...)'
          # OpenAI Responses API — one `input` string rather than a
          # messages list, so the whole prompt is the injection surface.
          - pattern: '$CLIENT.responses.create(..., input=$A + $B, ...)'
          - pattern: '$CLIENT.responses.create(..., input=f"...", ...)'

  - id: llm-missing-system-user-separation
    languages: [python]
    severity: WARNING
    metadata:
      owasp: "LLM01:2025 Prompt Injection"
    message: >
      An LLM call with no system/developer instruction separate from the
      user turn — every instruction ends up folded into user content,
      with no structural separation between "what the model should do"
      and "what the user/PR/untrusted content said." A real system
      prompt is the first line of defense against a user turn trying to
      override instructions. Anthropic takes this as the `system=`
      parameter; OpenAI takes it as a leading {"role": "system"} (or
      "developer") message in the messages list, or `instructions=` on
      the Responses API. NOTE: for OpenAI this is a weaker signal than
      for Anthropic — putting instructions in the first user turn is a
      common, sometimes deliberate pattern — so weigh the surrounding
      code before treating it as a real defect.
    # Same splat exclusion as the missing-cap rules, and for the same
    # reason. Found against simonw/llm, where every call is
    # `create(model=..., messages=..., **kwargs)` and the system prompt
    # arrives inside kwargs (_finalize_responses_kwargs sets
    # instructions=). Eight wrong findings from one blind spot: an
    # instructions= or a system turn that arrives by splat is not
    # evidence that no system prompt exists.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: '$CLIENT.messages.create(..., model=$M, messages=$MSGS, ...)'
              - pattern-not: '$CLIENT.messages.create(..., system=$S, ...)'
              - pattern-not: $CLIENT.messages.create(..., **$KW)
          - patterns:
              - pattern: '$CLIENT.chat.completions.create(..., model=$M, messages=$MSGS, ...)'
              - pattern-not: '$CLIENT.chat.completions.create(..., messages=[..., {"role": "system", "content": $S}, ...], ...)'
              - pattern-not: '$CLIENT.chat.completions.create(..., messages=[..., {"role": "developer", "content": $S}, ...], ...)'
              - pattern-not: $CLIENT.chat.completions.create(..., **$KW)
          - patterns:
              - pattern: '$CLIENT.responses.create(..., model=$M, input=$INPUT, ...)'
              - pattern-not: '$CLIENT.responses.create(..., instructions=$S, ...)'
              - pattern-not: $CLIENT.responses.create(..., **$KW)

  - id: llm-output-to-dangerous-sink
    languages: [python]
    severity: ERROR
    metadata:
      owasp: "LLM05:2025 Improper Output Handling"
    message: >
      LLM response content flows into eval(), exec(), subprocess, or
      os.system() with no validation in between — the model's output is
      treated as trusted code/commands. A prompt-injected model response
      becomes arbitrary code execution. Never execute model output
      directly; if the model must trigger an action, route it through an
      explicit allowlist of safe operations, never a raw eval/exec/shell.
    mode: taint
    pattern-sources:
      # Anthropic response shape
      - pattern: '$RESP.content[0].text'
      # OpenAI Chat Completions, non-streaming and streaming
      - pattern: '$RESP.choices[0].message.content'
      - pattern: '$CHUNK.choices[0].delta.content'
      # OpenAI Responses API convenience accessor
      - pattern: '$RESP.output_text'
    pattern-sinks:
      - pattern: 'eval(...)'
      - pattern: 'exec(...)'
      - pattern: 'subprocess.run(...)'
      - pattern: 'os.system(...)'

  - id: llm-output-to-sql
    languages: [python]
    severity: ERROR
    metadata:
      owasp: "LLM05:2025 Improper Output Handling"
    message: >
      LLM response content flows into a raw SQL execute() call — the
      model's output is treated as trusted SQL. Same class of bug as
      llm-output-to-dangerous-sink, specifically for the DB-API cursor
      sink: parameterize the query, never interpolate model output into
      SQL text directly.
    mode: taint
    pattern-sources:
      - pattern: '$RESP.content[0].text'
      - pattern: '$RESP.choices[0].message.content'
      - pattern: '$CHUNK.choices[0].delta.content'
      - pattern: '$RESP.output_text'
    # focus-metavariable pins the sink to the QUERY argument, not the
    # whole call. Without it, passing model output as a BOUND PARAMETER
    # — `cursor.execute("... WHERE x = ?", (text,))`, which is the
    # correct, safe way to use it — fired this rule, because the sink
    # could not tell the query text from the parameter tuple. That was
    # tracked as a `todook` in llm-security.py and is now a real `ok`.
    pattern-sinks:
      - patterns:
          - pattern: $CURSOR.execute($QUERY, ...)
          - focus-metavariable: $QUERY

  - id: llm-call-missing-max-tokens
    languages: [python]
    severity: WARNING
    metadata:
      owasp: "LLM10:2025 Unbounded Consumption"
    message: >
      An LLM call with no explicit output-length cap — an unbounded
      response size is an unbounded cost and latency tail per call. Set
      the cap explicitly on every call: max_tokens (Anthropic, and
      OpenAI Chat Completions), max_completion_tokens (OpenAI's newer
      reasoning models), or max_output_tokens (OpenAI Responses API).
    # A call whose arguments arrive as a dict splat is NOT evidence of a
    # missing cap: the cap may well be in the dict, and semgrep cannot
    # see inside it. Found by scanning this repo's own llm_call.py,
    # which sets both max_tokens and timeout and then passes
    # **create_kwargs — two findings, both wrong. A rule that asserts a
    # defect it cannot verify is precisely the cry-wolf failure, so it
    # stays quiet on the splat form instead.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: '$CLIENT.messages.create(...)'
              - pattern-not: $CLIENT.messages.create(..., **$KW)
              - pattern-not: '$CLIENT.messages.create(..., max_tokens=$N, ...)'
          - patterns:
              - pattern: '$CLIENT.chat.completions.create(...)'
              - pattern-not: $CLIENT.chat.completions.create(..., **$KW)
              - pattern-not: '$CLIENT.chat.completions.create(..., max_tokens=$N, ...)'
              - pattern-not: '$CLIENT.chat.completions.create(..., max_completion_tokens=$N, ...)'
          - patterns:
              - pattern: '$CLIENT.responses.create(...)'
              - pattern-not: $CLIENT.responses.create(..., **$KW)
              - pattern-not: '$CLIENT.responses.create(..., max_output_tokens=$N, ...)'

  - id: llm-unpinned-model-alias
    languages: [python]
    severity: WARNING
    metadata:
      owasp: "LLM03:2025 Supply Chain"
    message: >
      A floating model alias ("-latest") instead of a pinned version.
      The model backing a "-latest" alias can change without warning,
      silently changing review behavior, cost, and latency — pin an
      exact, dated model version instead. SCOPE: this rule detects the
      Anthropic/"-latest" naming convention only. It deliberately does
      NOT try to detect unpinned OpenAI models: OpenAI signals a
      floating alias by the ABSENCE of a date suffix ("gpt-4o" floats,
      "gpt-4o-2024-08-06" is pinned), so detecting it would mean
      flagging every bare model name — including every model held in a
      variable rather than a literal — at a false-positive rate that
      would drown the rest of this ruleset.
    patterns:
      - pattern-regex: 'model\s*=\s*["''][^"'']*-latest["'']'

  - id: llm-hardcoded-api-key
    languages: [python]
    severity: ERROR
    metadata:
      owasp: "LLM02:2025 Sensitive Information Disclosure"
    message: >
      An API key passed as a literal string instead of read from the
      environment/secret store. Hardcoded credentials end up in git
      history and logs.
    patterns:
      - pattern-either:
          - pattern: 'anthropic.Anthropic(api_key="...")'
          - pattern: 'anthropic.AsyncAnthropic(api_key="...")'
          - pattern: 'openai.OpenAI(api_key="...")'
          - pattern: 'openai.AsyncOpenAI(api_key="...")'
          - pattern-regex: '(?i)(anthropic|openai)_api_key\s*=\s*["''][A-Za-z0-9\-_]{16,}["'']'

  - id: llm-logging-full-prompt-or-response
    languages: [python]
    severity: WARNING
    metadata:
      owasp: "LLM02:2025 Sensitive Information Disclosure"
    message: >
      Logging or printing the full prompt or model response text. Both
      routinely contain PII, secrets echoed back from context, or
      injected content — logs are a durable, often broadly-readable
      sink. Log a hash, length, or explicitly-redacted summary instead
      of the raw text.
    patterns:
      - pattern-either:
          # Anthropic response shape
          - pattern: 'print($RESP.content[0].text)'
          - pattern: 'logging.info(..., $RESP.content[0].text, ...)'
          - pattern: 'logger.info(..., $RESP.content[0].text, ...)'
          # OpenAI Chat Completions
          - pattern: 'print($RESP.choices[0].message.content)'
          - pattern: 'logging.info(..., $RESP.choices[0].message.content, ...)'
          - pattern: 'logger.info(..., $RESP.choices[0].message.content, ...)'
          # OpenAI Responses API
          - pattern: 'print($RESP.output_text)'
          - pattern: 'logging.info(..., $RESP.output_text, ...)'
          - pattern: 'logger.info(..., $RESP.output_text, ...)'

  - id: llm-call-missing-timeout
    languages: [python]
    severity: WARNING
    metadata:
      owasp: "LLM10:2025 Unbounded Consumption"
    message: >
      An LLM call with no explicit timeout — a hung upstream connection
      blocks this call indefinitely instead of failing fast, which is an
      unbounded latency tail for whatever's waiting on it (a job's
      lease, an HTTP request). Pass timeout= explicitly rather than
      relying on the SDK's default; both the Anthropic and OpenAI
      clients accept it per-call or on the client constructor.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: '$CLIENT.messages.create(...)'
              - pattern-not: $CLIENT.messages.create(..., **$KW)
              - pattern-not: '$CLIENT.messages.create(..., timeout=$T, ...)'
          - patterns:
              - pattern: '$CLIENT.chat.completions.create(...)'
              - pattern-not: $CLIENT.chat.completions.create(..., **$KW)
              - pattern-not: '$CLIENT.chat.completions.create(..., timeout=$T, ...)'
          - patterns:
              - pattern: '$CLIENT.responses.create(...)'
              - pattern-not: $CLIENT.responses.create(..., **$KW)
              - pattern-not: '$CLIENT.responses.create(..., timeout=$T, ...)'

  - id: llm-sync-call-in-async-handler
    languages: [python]
    severity: ERROR
    metadata:
      owasp: "LLM10:2025 Unbounded Consumption"
    message: >
      A blocking LLM call made directly inside an `async def` function
      with no `await`/`to_thread` around it. The Anthropic and OpenAI
      SDKs' sync clients perform a real blocking network call; invoked
      straight inside an async handler (an HTTP route, an async worker
      task) it blocks the whole event loop for the duration of the LLM
      call, stalling every other concurrent request/heartbeat on that
      process. Use the async client (`await $CLIENT....create(...)`, via
      AsyncAnthropic/AsyncOpenAI) or push the sync call through
      `asyncio.to_thread`.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: |
                  async def $FUNC(...):
                    ...
                    $CLIENT.messages.create(...)
              - pattern-not: |
                  async def $FUNC(...):
                    ...
                    await $CLIENT.messages.create(...)
              - pattern-not: |
                  async def $FUNC(...):
                    ...
                    asyncio.to_thread($CLIENT.messages.create, ...)
          - patterns:
              - pattern: |
                  async def $FUNC(...):
                    ...
                    $CLIENT.chat.completions.create(...)
              - pattern-not: |
                  async def $FUNC(...):
                    ...
                    await $CLIENT.chat.completions.create(...)
              - pattern-not: |
                  async def $FUNC(...):
                    ...
                    asyncio.to_thread($CLIENT.chat.completions.create, ...)
          - patterns:
              - pattern: |
                  async def $FUNC(...):
                    ...
                    $CLIENT.responses.create(...)
              - pattern-not: |
                  async def $FUNC(...):
                    ...
                    await $CLIENT.responses.create(...)
              - pattern-not: |
                  async def $FUNC(...):
                    ...
                    asyncio.to_thread($CLIENT.responses.create, ...)

  # ===================================================================
  # LangChain / LlamaIndex call shapes, and the OWASP categories the
  # raw-SDK rules above do not reach.
  #
  # Severity discipline: ERROR only where there is a concrete exploit
  # path (code execution, a credential in source, injected content
  # reaching an interpreter). WARNING for hygiene. fix_threshold
  # defaults to HIGH, so ERROR is what actually gets a fix suggestion
  # attached to it - the line between the two is not cosmetic.
  #
  # NOT COVERED, deliberately: LLM04 (Data and Model Poisoning), LLM07
  # (System Prompt Leakage), LLM08 (Vector and Embedding Weaknesses) and
  # LLM09 (Misinformation). Poisoning is a property of where data came
  # from and misinformation a property of whether output is true;
  # neither is visible in a call shape. Rules for them would be keyword
  # matches dressed as security checks, and a noisy rule is expensive to
  # walk back once it is posting on real pull requests.
  # ===================================================================

  - id: llm-langchain-prompt-from-fstring
    languages: [python]
    severity: ERROR
    metadata:
      owasp: "LLM01:2025 Prompt Injection"
      verified: >
        2026-09-23: symbols present in langchain 1.4.2 / langchain-community
        0.4.2 / langchain-experimental 0.4.2 / llama-index-core 0.14.25
    message: >
      A LangChain prompt template built from an f-string. The f-string
      interpolates its variables at construction time, so whatever they
      held is spliced into the template text itself - the templating
      that was supposed to keep untrusted values in labelled slots never
      happens, and a user-controlled value becomes indistinguishable
      from the instructions around it. Pass the values at invoke time
      instead, so they stay parameters.
    patterns:
      - pattern-either:
          - pattern: PromptTemplate.from_template(f"...", ...)
          - pattern: ChatPromptTemplate.from_template(f"...", ...)
          - pattern: SystemMessagePromptTemplate.from_template(f"...", ...)
          - pattern: HumanMessagePromptTemplate.from_template(f"...", ...)

  - id: llm-fetched-content-into-prompt
    languages: [python]
    severity: ERROR
    metadata:
      owasp: "LLM01:2025 Prompt Injection"
      verified: >
        2026-09-23: requests/httpx shapes only, no wrapper library involved
    message: >
      Content fetched over HTTP flows into an LLM prompt with nothing in
      between. This is indirect prompt injection: the instructions come
      from the fetched page rather than from your user, so an attacker
      who controls any page you scrape controls part of your prompt.
      Delimit fetched content explicitly as data, and treat anything it
      says that looks like an instruction as hostile.
    mode: taint
    pattern-sources:
      - pattern: requests.get(...).text
      - pattern: requests.post(...).text
      - pattern: httpx.get(...).text
    pattern-sinks:
      - pattern: $CLIENT.messages.create(...)
      - pattern: $CLIENT.chat.completions.create(...)
      - pattern: $CLIENT.responses.create(...)

  - id: llm-secret-into-prompt
    languages: [python]
    severity: ERROR
    metadata:
      owasp: "LLM02:2025 Sensitive Information Disclosure"
      verified: >
        2026-09-23: stdlib os.environ and raw SDK shapes only
    message: >
      An environment secret flows into an LLM prompt. Whatever is in the
      prompt is available to the model and can be coaxed back out of it,
      logged by the provider, or echoed into a response - a key in the
      prompt should be assumed disclosed. Pass an identifier the model
      can reason about instead of the credential itself, and make the
      privileged call from your own code.
    mode: taint
    pattern-sources:
      - pattern: os.environ[...]
      - pattern: os.environ.get(...)
      - pattern: os.getenv(...)
    # focus-metavariable, so the sink is the PROMPT argument rather than
    # the whole call. Without it, a secret reaching any other argument
    # fires a rule about prompt content — `model=os.environ["MODEL"]` is
    # the obvious case, and it is ordinary correct code.
    pattern-sinks:
      - patterns:
          - pattern: $CLIENT.messages.create(..., messages=$MSGS, ...)
          - focus-metavariable: $MSGS
      - patterns:
          - pattern: $CLIENT.messages.create(..., system=$S, ...)
          - focus-metavariable: $S
      - patterns:
          - pattern: $CLIENT.chat.completions.create(..., messages=$MSGS, ...)
          - focus-metavariable: $MSGS
      - patterns:
          - pattern: $CLIENT.responses.create(..., input=$INPUT, ...)
          - focus-metavariable: $INPUT

  - id: llm-langchain-verbose-enabled
    languages: [python]
    severity: WARNING
    metadata:
      owasp: "LLM02:2025 Sensitive Information Disclosure"
      verified: >
        2026-09-23:
        LLMChain/AgentExecutor/initialize_agent/RetrievalQA/ConversationChain
        moved to langchain-classic in LangChain 1.x; names unchanged, so
        these patterns still match both 0.x and 1.x code. verbose= confirmed
        on AgentExecutor
    message: >
      A LangChain chain or agent constructed with verbose=True. Verbose
      mode prints the fully-rendered prompt and the raw model response
      to stdout on every call - in a deployed service that is a durable,
      often broadly-readable sink for whatever the prompt contained,
      including retrieved documents and anything a user pasted. Use a
      callback handler that logs what you actually want instead.
    patterns:
      - pattern-either:
          - pattern: LLMChain(..., verbose=True, ...)
          - pattern: AgentExecutor(..., verbose=True, ...)
          - pattern: AgentExecutor.from_agent_and_tools(..., verbose=True, ...)
          - pattern: initialize_agent(..., verbose=True, ...)
          - pattern: RetrievalQA.from_chain_type(..., verbose=True, ...)
          - pattern: ConversationChain(..., verbose=True, ...)

  - id: llm-langchain-hardcoded-api-key
    languages: [python]
    severity: ERROR
    metadata:
      owasp: "LLM02:2025 Sensitive Information Disclosure"
      verified: >
        2026-09-23: ChatOpenAI accepts openai_api_key and api_key;
        ChatAnthropic accepts anthropic_api_key and api_key;
        OpenAIEmbeddings accepts both. All confirmed
    message: >
      An API key passed as a literal string to a LangChain or
      LlamaIndex model constructor. Same defect as
      llm-hardcoded-api-key, for the wrapper libraries: the credential
      ends up in git history and in every log that prints the object.
      Read it from the environment or a secret store.
    patterns:
      - pattern-either:
          - pattern: ChatOpenAI(..., openai_api_key="...", ...)
          - pattern: ChatOpenAI(..., api_key="...", ...)
          - pattern: ChatAnthropic(..., anthropic_api_key="...", ...)
          - pattern: ChatAnthropic(..., api_key="...", ...)
          - pattern: OpenAIEmbeddings(..., openai_api_key="...", ...)

  - id: llm-trust-remote-code
    languages: [python]
    severity: ERROR
    metadata:
      owasp: "LLM03:2025 Supply Chain"
      verified: >
        2026-09-23: trust_remote_code confirmed in transformers — in
        pipeline()'s signature, and in Auto*.from_pretrained via **kwargs
    message: >
      trust_remote_code=True executes Python that ships with the model
      repository, at load time, with this process's privileges. A model
      is a supply-chain dependency like any other, and this flag opts
      out of the boundary that normally stops a downloaded artifact
      running code. Pin to a model that needs no custom code, or vendor
      and review that code yourself.
    patterns:
      - pattern-either:
          - pattern: $M.from_pretrained(..., trust_remote_code=True, ...)
          - pattern: pipeline(..., trust_remote_code=True, ...)

  - id: llm-llamaindex-download-loader
    languages: [python]
    severity: ERROR
    metadata:
      owasp: "LLM03:2025 Supply Chain"
      verified: >
        2026-09-23: download_loader is ABSENT from llama-index-core 0.14.25
        and could not be found in any installed llama-index package. This
        rule targets llama-index <=0.10 only and will match nothing on
        current versions. Kept because 0.10-era code is still widespread,
        but do not read a clean scan as evidence the ruleset checked
        anything here
    message: >
      download_loader() fetches loader code from LlamaHub at runtime and
      executes it. What runs is whatever the hub serves at the moment of
      the call - unpinned, unreviewed, and outside your dependency
      lockfile. Install the loader as a normal pinned dependency.
    patterns:
      - pattern-either:
          - pattern: download_loader(...)

  - id: llm-unsafe-model-deserialization
    languages: [python]
    severity: WARNING
    metadata:
      owasp: "LLM03:2025 Supply Chain"
      verified: >
        UNVERIFIED — torch is not installed and was not pulled in for this
        check (~800MB for one signature). Two specific risks, both
        unconfirmed: torch.load's weights_only default is believed to have
        flipped to True in torch 2.6, which would make this rule fire on
        code that is already safe; and the kwarg name itself is unverified.
        Treat findings from this rule as advisory until someone checks it
        against the torch version in use
    message: >
      A model checkpoint loaded without restricting deserialization.
      torch.load() unpickles by default, and unpickling runs arbitrary
      code in the loading process - a downloaded checkpoint is untrusted
      input. Pass weights_only=True, or use a format that cannot execute
      (safetensors).
    patterns:
      - patterns:
          - pattern: torch.load(...)
          - pattern-not: torch.load(..., weights_only=True, ...)

  - id: llm-output-to-html
    languages: [python]
    severity: ERROR
    metadata:
      owasp: "LLM05:2025 Improper Output Handling"
      verified: >
        2026-09-23: HTMLResponse (fastapi), Markup (markupsafe) and
        render_template_string (flask) all confirmed. mark_safe UNVERIFIED —
        django not installed
    message: >
      LLM response content is rendered as HTML rather than as text. The
      model's output is attacker-influenceable - through the prompt,
      through retrieved documents, through anything it was shown - so
      rendering it unescaped is stored XSS with an extra step. Render it
      as text, or sanitise with an allowlist before it becomes markup.
    mode: taint
    pattern-sources:
      - pattern: $RESP.content[0].text
      - pattern: $RESP.choices[0].message.content
      - pattern: $CHUNK.choices[0].delta.content
      - pattern: $RESP.output_text
    pattern-sinks:
      - pattern: render_template_string(...)
      - pattern: Markup(...)
      - pattern: HTMLResponse(...)
      - pattern: mark_safe(...)

  - id: llm-llamaindex-pandas-query-engine
    languages: [python]
    severity: ERROR
    metadata:
      owasp: "LLM05:2025 Improper Output Handling"
      verified: >
        2026-09-23: present, though it has MOVED to
        llama_index.core.query_engine from llama_index.experimental.
        Harmless here: these patterns match the call shape, not the import
        path
    message: >
      PandasQueryEngine executes Python the model wrote, against your
      dataframe, via eval. Its own documentation warns it is not safe
      against a hostile prompt: anything reaching the query text reaches
      the interpreter. Do not expose it to untrusted input; if you need
      natural-language querying, constrain it to an allowlist of
      operations you implement yourself.
    patterns:
      - pattern-either:
          - pattern: PandasQueryEngine(...)
          - pattern: PandasQueryEngine.from_defaults(...)

  - id: llm-langchain-python-repl-tool
    languages: [python]
    severity: ERROR
    metadata:
      owasp: "LLM06:2025 Excessive Agency"
      verified: >
        2026-09-23: PythonREPLTool, PythonAstREPLTool and PythonREPL all
        present in langchain-experimental 0.4.2
    message: >
      A Python REPL tool handed to an agent. The agent decides what code
      to run, so the model's output reaches exec() with this process's
      privileges - prompt injection becomes remote code execution in one
      step. If an agent genuinely needs to compute, give it a tool that
      performs the specific operation rather than one that runs
      arbitrary Python.
    patterns:
      - pattern-either:
          - pattern: PythonREPLTool(...)
          - pattern: PythonAstREPLTool(...)
          - pattern: PythonREPL(...)

  - id: llm-langchain-shell-tool
    languages: [python]
    severity: ERROR
    metadata:
      owasp: "LLM06:2025 Excessive Agency"
      verified: >
        2026-09-23: ShellTool present in langchain-community 0.4.2
    message: >
      A shell tool handed to an agent. The model chooses the command, so
      anything that can steer the model can run shell commands as this
      process. There is no prompt that makes this safe against
      injection - replace it with narrowly-scoped tools that each do one
      thing.
    patterns:
      - pattern-either:
          - pattern: ShellTool(...)

  - id: llm-nl-to-sql-engine
    languages: [python]
    severity: WARNING
    metadata:
      owasp: "LLM05:2025 Improper Output Handling"
      verified: >
        2026-09-23: SQLDatabaseChain (langchain-experimental),
        create_sql_agent (langchain-community) and NLSQLTableQueryEngine
        (llama-index-core) all present
    message: >
      A natural-language-to-SQL component executes queries the model
      wrote against your database. That is the component's whole
      purpose, so it is not automatically a defect - but it means prompt
      content reaches the database, and the protection that matters sits
      outside this call: connect with a read-only, least-privilege role
      scoped to the tables involved, rather than relying on the model
      not to write a destructive statement.
    patterns:
      - pattern-either:
          - pattern: NLSQLTableQueryEngine(...)
          - pattern: SQLDatabaseChain(...)
          - pattern: SQLDatabaseChain.from_llm(...)
          - pattern: create_sql_agent(...)

  - id: llm-agent-allow-dangerous
    languages: [python]
    severity: ERROR
    metadata:
      owasp: "LLM06:2025 Excessive Agency"
      verified: >
        2026-09-23: allow_dangerous_code confirmed on
        create_pandas_dataframe_agent, allow_dangerous_requests on
        RequestsToolkit, allow_dangerous_deserialization on FAISS.load_local
    message: >
      An explicit opt-in to a LangChain component's dangerous mode.
      These flags exist because the component can execute
      model-generated code, deserialize untrusted data, or issue
      model-chosen HTTP requests, and the library refuses unless you say
      so in writing. Setting one to True is a decision to let model
      output act; make sure it is deliberate, scoped, and not reachable
      from untrusted input.
    patterns:
      - pattern-either:
          - pattern: $F(..., allow_dangerous_code=True, ...)
          - pattern: $F(..., allow_dangerous_requests=True, ...)
          - pattern: $F(..., allow_dangerous_deserialization=True, ...)

  - id: llm-agent-missing-max-iterations
    languages: [python]
    severity: WARNING
    metadata:
      owasp: "LLM06:2025 Excessive Agency"
      verified: >
        2026-09-23: AgentExecutor and initialize_agent moved to
        langchain-classic in LangChain 1.x; names unchanged so the patterns
        still match. SCOPE LIMIT: LangChain 1.x's new agent API is
        create_agent(), which has NO max_iterations parameter at all —
        iteration limits moved to middleware. This rule therefore says
        nothing about agents built the 1.x way
    message: >
      An agent executor with no iteration cap. An agent that cannot
      reach its goal keeps calling tools and re-prompting until
      something else stops it - an unbounded number of model calls, each
      with a cost, and an unbounded number of tool side effects. Set
      max_iterations (and max_execution_time) explicitly.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: AgentExecutor(...)
              - pattern-not: AgentExecutor(..., **$KW)
              - pattern-not: AgentExecutor(..., max_iterations=$N, ...)
          - patterns:
              - pattern: initialize_agent(...)
              - pattern-not: initialize_agent(..., **$KW)
              - pattern-not: initialize_agent(..., max_iterations=$N, ...)

  - id: llm-langchain-missing-max-tokens
    languages: [python]
    severity: WARNING
    metadata:
      owasp: "LLM10:2025 Unbounded Consumption"
      verified: >
        2026-09-23: max_tokens confirmed on both ChatOpenAI and
        ChatAnthropic
    message: >
      A LangChain chat model constructed with no output-length cap.
      Same defect as llm-call-missing-max-tokens, for the wrapper
      libraries: an unbounded response is an unbounded cost and latency
      tail on every call made through this model.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: ChatOpenAI(...)
              - pattern-not: ChatOpenAI(..., **$KW)
              - pattern-not: ChatOpenAI(..., max_tokens=$N, ...)
          - patterns:
              - pattern: ChatAnthropic(...)
              - pattern-not: ChatAnthropic(..., **$KW)
              - pattern-not: ChatAnthropic(..., max_tokens=$N, ...)

  - id: llm-langchain-missing-timeout
    languages: [python]
    severity: WARNING
    metadata:
      owasp: "LLM10:2025 Unbounded Consumption"
      verified: >
        2026-09-23: ChatOpenAI accepts request_timeout and timeout.
        ChatAnthropic accepts timeout and default_request_timeout but NOT
        request_timeout — an earlier version of this rule omitted
        default_request_timeout and wrongly flagged code that set it
    message: >
      A LangChain chat model constructed with no request timeout. A hung
      upstream connection blocks whatever is waiting on this model
      indefinitely rather than failing fast. Pass request_timeout (or
      timeout) explicitly rather than relying on the library default.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: ChatOpenAI(...)
              - pattern-not: ChatOpenAI(..., **$KW)
              - pattern-not: ChatOpenAI(..., request_timeout=$T, ...)
              - pattern-not: ChatOpenAI(..., timeout=$T, ...)
          - patterns:
              - pattern: ChatAnthropic(...)
              - pattern-not: ChatAnthropic(..., **$KW)
              # ChatAnthropic does NOT accept request_timeout — verified
              # against langchain-anthropic 1.7.2, where its fields are
              # `timeout` and `default_request_timeout`. Without the
              # latter listed here, code that correctly sets
              # default_request_timeout was flagged as having no timeout.
              - pattern-not: ChatAnthropic(..., timeout=$T, ...)
              - pattern-not: ChatAnthropic(..., default_request_timeout=$T, ...)
