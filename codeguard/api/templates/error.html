{% extends "base.html" %}
{% block title %}{{ status }} · CodeGuard{% endblock %}

{% block content %}
<div class="panel" style="margin-top: 40px;">
  <div class="state">
    <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      {% if status == 404 %}
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
      {% else %}
        <circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5h.01"></path>
      {% endif %}
    </svg>
    <div class="title">{{ title }}</div>
    <div class="body">{{ body }}</div>
    <div class="actions"><a class="btn primary" href="/dashboard">Back to reviews</a></div>
  </div>
</div>
{% endblock %}
