# Phase 10: scrapes api's and worker's /metrics endpoints. Local dev
# targets (container DNS names on the docker-compose network) and the
# live Azure Container Apps deployment are both scraped, labeled by
# `env` so the dashboard can filter/compare either — Prometheus doesn't
# do env-var interpolation in this file, so the Azure hostname below is
# committed literally rather than templated; if the app is ever
# recreated under a different auto-generated FQDN, update it here.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: codeguard-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          env: local

  - job_name: codeguard-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9000"]
        labels:
          env: local

  # The Azure target needs a bearer token; the two local targets do not.
  # /metrics is on a public ingress there and used to answer anonymously,
  # serving repo names, job counts and cost to anyone who asked. It is
  # excluded from EasyAuth on purpose — EasyAuth would answer a scrape
  # with a login redirect — so a token Prometheus can send as a header is
  # the only gate that works for a machine client.
  #
  # The token lives in observability/metrics-token (gitignored). Create
  # it with the same value as the container app's metrics-auth-token
  # secret. Prometheus does no env-var interpolation in this file, which
  # is why it is a file reference rather than ${VAR}. With no such file
  # Prometheus fails this job loudly at startup rather than scraping
  # unauthenticated and appearing to work.
  - job_name: codeguard-api-azure
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["codeguard-api.ashyhill-c8f8312c.westus.azurecontainerapps.io"]
        labels:
          env: azure

  # Worker has no public ingress in the Azure deployment — its :9000
  # metrics port isn't reachable from outside the Container Apps
  # environment (deliberate: it's a scale-to-zero background processor,
  # not something that should ever be internet-facing). A VNet-joined
  # Prometheus or Container Apps' own Azure Monitor export would be
  # needed to scrape it from outside Azure; the dashboard's worker
  # panels only show data for the local env until then.
